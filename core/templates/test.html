<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🥬 Магазин овощей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            background: #ff9800;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .refresh-btn:hover {
            background: #f57c00;
            transform: translateY(-2px);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .product-emoji {
            font-size: 4em;
            text-align: center;
            display: block;
            margin-bottom: 15px;
        }
        .product-name {
            font-size: 1.4em;
            color: #2e7d32;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .product-type {
            display: inline-block;
            background: #e8f5e9;
            color: #558b2f;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 15px;
        }
        .product-price {
            font-size: 1.6em;
            color: #ff9800;
            font-weight: bold;
        }
        .product-price span {
            font-size: 0.6em;
            color: #777;
        }
        .product-id {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f5f5f5;
            color: #999;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }
        .loading {
            text-align: center;
            font-size: 1.5em;
            color: #2e7d32;
            padding: 50px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>🥬 Магазин свежих овощей</h1>
        <p>Только лучшие продукты с грядки!</p>
    </header>

    <button class="refresh-btn" onclick="fetchProducts()">🔄 Обновить каталог</button>

    <div id="products" class="products-grid">
        <div class="loading">Загрузка товаров...</div>
    </div>

    <script>
        const emojis = {
            'korneplod': '🥕',
            'klubneplod': '🥔',
            'kapystnye': '🥬',
            'paslenovy': '🍅',
            'lukovy': '🧅',
            'tykvenny': '🎃',
            'zelensky': '🌿'
        };

        const typeNames = {
            'korneplod': 'Корнеплод',
            'klubneplod': 'Клубнеплод',
            'kapystnye': 'Капустный',
            'paslenovy': 'Паслёновый',
            'lukovy': 'Луковый',
            'tykvenny': 'Тыквенный',
            'zelensky': 'Зелень'
        };

        async function fetchProducts() {
            const container = document.getElementById('products');
            container.innerHTML = '<div class="loading">Загрузка товаров...</div>';
            
            try {
                const response = await fetch('http://127.0.0.1:8000/products/');
                const data = await response.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="loading">Товаров пока нет</div>';
                    return;
                }

                container.innerHTML = data.map(product => `
                    <div class="product-card">
                        <span class="product-id">#${product.id}</span>
                        <span class="product-emoji">${emojis[product.type] || '🥗'}</span>
                        <div class="product-name">${product.name}</div>
                        <span class="product-type">${typeNames[product.type] || product.type}</span>
                        <div class="product-price">${product.price} <span>с/кг</span></div>
                    </div>
                `).join('');
                
            } catch (error) {
                container.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        // Загрузка при старте страницы
        fetchProducts();
    </script>
</body>
</html>
